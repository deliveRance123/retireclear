<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#9E7D3B" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174C3C" />
      <stop offset="100%" stop-color="#10382E" />
    </linearGradient>
  </defs>

  <!-- Emblem Mark (Left) -->
  <g transform="translate(10, 5)">
    <!-- Outer Shield / Circle with gold trim -->
    <circle cx="35" cy="35" r="33" fill="url(#greenGradient)" stroke="#C6A15B" stroke-width="2.5" />
    <circle cx="35" cy="35" r="28" fill="none" stroke="#DCE8DF" stroke-width="0.8" stroke-dasharray="2 2" />
    
    <!-- Abstract Stylized Eagle Wings / Laurel -->
    <path d="M 18,36 C 21,24 28,18 35,16 C 42,18 49,24 52,36 C 47,31 42,28 35,28 C 28,28 23,31 18,36 Z" fill="url(#goldGradient)" />
    
    <!-- Central Document Crest -->
    <rect x="26" y="27" width="18" height="24" rx="2" fill="#F8F7F2" stroke="#10382E" stroke-width="1.2" />
    <line x1="30" y1="32" x2="40" y2="32" stroke="#174C3C" stroke-width="1.2" stroke-linecap="round" />
    <line x1="30" y1="36" x2="40" y2="36" stroke="#174C3C" stroke-width="1.2" stroke-linecap="round" />
    <line x1="30" y1="40" x2="37" y2="40" stroke="#174C3C" stroke-width="1.2" stroke-linecap="round" />
    
    <!-- Verification Checkmark / Ribbon -->
    <circle cx="41" cy="45" r="7" fill="#174C3C" stroke="#C6A15B" stroke-width="1" />
    <path d="M 38,45 L 40,47 L 44,43" fill="none" stroke="#F8F7F2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(90, 20)">
    <!-- Federal Prefix -->
    <text x="0" y="8" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#C6A15B" letter-spacing="1.5">FEDERAL REPUBLIC OF NIGERIA</text>
    
    <!-- Main Brand Name -->
    <text x="0" y="27" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#174C3C" letter-spacing="0.5">NATIONAL RETIREMENT CLEARANCE PORTAL</text>
    
    <!-- Subtitle -->
    <text x="0" y="42" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#778079" letter-spacing="0.2">AI-Integrated Retirement Verification System</text>
  </g>
</svg>
