<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#9E7D3B" />
    </linearGradient>
    <linearGradient id="favGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174C3C" />
      <stop offset="100%" stop-color="#10382E" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="32" cy="32" r="30" fill="url(#favGreen)" stroke="#C6A15B" stroke-width="2.5" />
  <circle cx="32" cy="32" r="26" fill="none" stroke="#DCE8DF" stroke-width="0.8" stroke-dasharray="2 2" />
  
  <!-- Stylized Eagle Wings -->
  <path d="M 16,32 C 19,21 26,16 32,14 C 38,16 45,21 48,32 C 43,28 38,25 32,25 C 26,25 21,28 16,32 Z" fill="url(#favGold)" />
  
  <!-- Central Document Shape -->
  <rect x="23" y="24" width="18" height="24" rx="2" fill="#F8F7F2" stroke="#10382E" stroke-width="1.2" />
  <line x1="27" y1="29" x2="37" y2="29" stroke="#174C3C" stroke-width="1.2" stroke-linecap="round" />
  <line x1="27" y1="33" x2="37" y2="33" stroke="#174C3C" stroke-width="1.2" stroke-linecap="round" />
  <line x1="27" y1="37" x2="34" y2="37" stroke="#174C3C" stroke-width="1.2" stroke-linecap="round" />
  
  <!-- Verification Seal Badge -->
  <circle cx="37" cy="42" r="7.5" fill="#174C3C" stroke="#C6A15B" stroke-width="1.2" />
  <path d="M 34,42 L 36.5,44.5 L 40.5,40" fill="none" stroke="#F8F7F2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
