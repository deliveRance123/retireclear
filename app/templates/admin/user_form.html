{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card card-custom p-4 mb-4">
      <div class="mb-4 pb-3 border-bottom">
        <h4 class="fw-bold text-dark-evergreen mb-1">{{ title }}</h4>
        <p class="text-muted small mb-0">Provision an administrative or officer account with role-based access privileges.</p>
      </div>

      <form method="POST" action="{{ request.path }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label">First Name *</label>
            <input type="text" name="first_name" class="form-control" required placeholder="e.g. Ibrahim">
          </div>
          <div class="col-md-6">
            <label class="form-label">Last Name *</label>
            <input type="text" name="last_name" class="form-control" required placeholder="e.g. Danjuma">
          </div>
          <div class="col-md-6">
            <label class="form-label">Username *</label>
            <input type="text" name="username" class="form-control" required placeholder="e.g. i_danjuma">
          </div>
          <div class="col-md-6">
            <label class="form-label">Official Email Address *</label>
            <input type="email" name="email" class="form-control" required placeholder="e.g. ibrahim.d@mda.gov.ng">
          </div>
          <div class="col-md-6">
            <label class="form-label">System Role *</label>
            <select name="role_id" class="form-select" required>
              <option value="">Select Role Assignment...</option>
              {% for r in roles %}
                <option value="{{ r.id }}">{{ r.display_name }} ({{ r.name }})</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Official Phone Number</label>
            <input type="text" name="phone" class="form-control" placeholder="+2348012345678">
          </div>
          <div class="col-md-12">
            <label class="form-label">Initial Account Password *</label>
            <input type="password" name="password" class="form-control" required placeholder="Must be at least 8 characters">
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
          <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Cancel
          </a>
          <button type="submit" class="btn btn-primary px-4 py-2">
            <i class="bi bi-check2-circle me-1"></i> Create Account
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
